<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVERY1ISAWINNER</title>
    <style>
        :root {
            --neon-purple: #9d00ff;
            --neon-gold: #ffd700;
            --neon-pink: #ff00ff;
            --bg-dark: #0a0510;
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 50%, #1a0a2e 0%, var(--bg-dark) 100%);
            color: white;
            font-family: 'Segoe UI', Impact, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            min-height: 100vh;
        }

        h1 {
            color: white;
            text-shadow: 0 0 15px var(--neon-purple);
            font-size: 3.5rem;
            margin: 30px 0 10px;
            letter-spacing: 12px;
            font-style: italic;
        }

        .pity-container { width: 350px; margin-bottom: 30px; text-align: center; }
        .pity-bar { width: 100%; height: 10px; background: #000; border: 1px solid var(--neon-purple); border-radius: 5px; overflow: hidden; }
        #pity-fill { height: 100%; width: 0%; background: var(--neon-purple); box-shadow: 0 0 15px var(--neon-purple); transition: width 0.4s; }

        .machine {
            background: #120a1d;
            padding: 25px;
            border: 4px solid var(--neon-purple);
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(157, 0, 255, 0.3);
            transition: 0.3s;
        }

        .jackpot-glow { 
            animation: jackpot-flash 0.3s infinite alternate; 
            border-color: var(--neon-gold) !important;
            box-shadow: 0 0 60px var(--neon-gold) !important;
        }
        @keyframes jackpot-flash { to { filter: brightness(1.8); transform: scale(1.02); } }

        .reels { display: flex; gap: 15px; background: #000; padding: 12px; border-radius: 10px; }
        .reel { width: 140px; height: 200px; background: #050505; overflow: hidden; position: relative; border: 1px solid #222; }
        .strip { position: absolute; top: 0; left: 0; width: 100%; }
        .strip img { width: 140px; height: 200px; display: block; object-fit: contain; }

        .controls { margin-top: 40px; text-align: center; }
        #status { height: 1.5em; font-size: 1.8rem; color: white; margin-bottom: 20px; font-weight: bold; }

        button {
            background: transparent;
            color: white;
            border: 2px solid var(--neon-purple);
            padding: 15px 60px;
            font-size: 1.8rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 50px;
            text-transform: uppercase;
            transition: 0.3s;
        }
        button:hover:not(:disabled) { background: var(--neon-purple); box-shadow: 0 0 30px var(--neon-purple); }
        button:disabled { opacity: 0.2; }
    </style>
</head>
<body>

    <h1>EVERY1</h1>

    <div class="pity-container">
        <div class="pity-bar"><div id="pity-fill"></div></div>
    </div>

    <div class="machine" id="machine-body">
        <div class="reels">
            <div class="reel"><div id="strip1" class="strip"></div></div>
            <div class="reel"><div id="strip2" class="strip"></div></div>
            <div class="reel"><div id="strip3" class="strip"></div></div>
        </div>
    </div>

    <div class="controls">
        <div id="status">DEAL THE CARDS</div>
        <button id="spin-btn">SPIN</button>
    </div>

<script>
    // --- ADVANCED AUDIO ENGINE ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playNote(freq, type, start, duration, vol = 0.1) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + start);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime + start);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + start + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + start);
        osc.stop(audioCtx.currentTime + start + duration);
    }

    // Sound Effects Library
    const sounds = {
        click: () => playNote(150, 'sine', 0, 0.05, 0.3), // Reel stop
        pair: () => { // 2 of a kind
            playNote(523.25, 'triangle', 0, 0.2); 
            playNote(659.25, 'triangle', 0.1, 0.3);
        },
        jackpot: () => { // Standard 3-of-a-kind
            [523, 659, 783, 1046].forEach((f, i) => playNote(f, 'square', i * 0.1, 0.4, 0.05));
        },
        legendary: () => { // Ace Jackpot
            for(let i=0; i<8; i++) playNote(523 + (i*100), 'sawtooth', i * 0.1, 0.5, 0.03);
        },
        death: () => { // Backlash / Death
            playNote(100, 'sawtooth', 0, 0.5, 0.2);
            playNote(110, 'sawtooth', 0.1, 0.5, 0.2);
        }
    };

    // --- GAME LOGIC ---
    const symbols = [
        { id: "Jack", url: "jack.png", weight: 6 },
        { id: "Queen", url: "queen.png", weight: 5 },
        { id: "King", url: "king.png", weight: 4 },
        { id: "Ace", url: "ace.png", weight: 3 },
        { id: "Death", url: "death.png", weight: 2 }
    ];

    let currentMisses = 0;
    const pityLimit = 10;
    const strips = [document.getElementById('strip1'), document.getElementById('strip2'), document.getElementById('strip3')];

    function init() {
        strips.forEach(strip => {
            strip.innerHTML = '';
            for(let i=0; i<60; i++) {
                symbols.forEach(s => {
                    const img = document.createElement('img');
                    img.src = s.url;
                    strip.appendChild(img);
                });
            }
        });
    }

    function weightedRandom() {
        let total = symbols.reduce((s, item) => s + item.weight, 0);
        let r = Math.random() * total;
        for (let s of symbols) {
            if (r < s.weight) return s;
            r -= s.weight;
        }
    }

    document.getElementById('spin-btn').addEventListener('click', function() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        this.disabled = true;
        const status = document.getElementById('status');
        const machine = document.getElementById('machine-body');
        
        status.innerText = "ROLLING...";
        status.style.color = "white";
        machine.classList.remove('jackpot-glow');
        
        strips.forEach(s => { s.style.transition = 'none'; s.style.top = '0px'; });

        setTimeout(() => {
            let results;
            if (currentMisses >= pityLimit) {
                const win = symbols[Math.floor(Math.random() * 5)];
                results = [win, win, win];
            } else {
                results = [weightedRandom(), weightedRandom(), weightedRandom()];
            }

            strips.forEach((strip, i) => {
                const symbolIndex = symbols.findIndex(s => s.id === results[i].id);
                const moveAmount = ((50 * symbols.length) + symbolIndex) * 200;
                const duration = 2 + (i * 0.5);
                strip.style.transition = `top ${duration}s cubic-bezier(0.1, 0, 0.1, 1)`;
                strip.style.top = `-${moveAmount}px`;

                // CLICK SOUND ON STOP
                setTimeout(() => sounds.click(), duration * 1000);
            });

            // Wait for final reel to stop before calculating win
            setTimeout(() => {
                const counts = {};
                results.forEach(r => counts[r.id] = (counts[r.id] || 0) + 1);
                
                let msg = "Nothing Special...";
                let isJackpot = false;

                const jackpot = symbols.find(s => counts[s.id] === 3);
                if (jackpot) {
                    isJackpot = true;
                    currentMisses = 0;
                    machine.classList.add('jackpot-glow');
                    status.style.color = "var(--neon-gold)";
                    
                    if (jackpot.id === "Ace") { msg = "LEGENDARY JACKPOT"; sounds.legendary(); }
                    else if (jackpot.id === "Death") { msg = "NO STAND FOR YOU"; sounds.death(); }
                    else { msg = jackpot.id.toUpperCase() + " JACKPOT"; sounds.jackpot(); }
                } 
                else if (counts["Death"] >= 1) {
                    msg = counts["Death"] === 2 ? "I LOST THE HOUSE" : "BACKLASH";
                    status.style.color = "#ff4444";
                    sounds.death();
                    currentMisses++;
                } 
                else {
                    const pair = symbols.find(s => counts[s.id] === 2);
                    if (pair) {
                        msg = pair.id === "Ace" ? "Ace in the sleeve" : pair.id + " Pair";
                        status.style.color = "var(--neon-purple)";
                        sounds.pair();
                    }
                    currentMisses++;
                }

                status.innerText = msg;
                document.getElementById('pity-fill').style.width = (Math.min(currentMisses/pityLimit, 1)*100) + "%";
                this.disabled = false;
            }, 3200);
        }, 50);
    });

    init();
</script>
</body>
</html>
