<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON CASINO: STARDUST</title>
    <style>
        :root {
            --neon-green: #39ff14;
            --neon-purple: #bc13fe;
            --neon-pink: #ff00ff;
            --bg-dark: #050505;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(188, 19, 254, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(57, 255, 20, 0.15) 0%, transparent 50%);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .kanji {
            position: fixed;
            color: var(--neon-purple);
            font-size: 5rem;
            opacity: 0.2;
            font-weight: bold;
            font-style: italic;
            z-index: 0;
            pointer-events: none;
            user-select: none;
        }

        h1 {
            color: var(--neon-green);
            text-shadow: 0 0 10px var(--neon-green), 0 0 20px var(--neon-purple);
            font-size: 3.5rem;
            margin: 30px 0 10px 0;
            letter-spacing: 10px;
            z-index: 10;
            text-align: center;
        }

        .pity-container {
            width: 350px;
            margin-bottom: 30px;
            z-index: 10;
            text-align: center;
        }

        .pity-label { color: var(--neon-pink); text-transform: uppercase; font-weight: bold; margin-bottom: 5px; display: block; font-size: 0.9rem; }
        .pity-bar { width: 100%; height: 12px; background: #111; border: 2px solid var(--neon-pink); border-radius: 10px; overflow: hidden; box-shadow: 0 0 10px rgba(255, 0, 255, 0.2); }
        #pity-fill { height: 100%; width: 0%; background: var(--neon-pink); box-shadow: 0 0 10px var(--neon-pink); transition: width 0.4s ease-out; }

        .machine {
            background: linear-gradient(145deg, #1a1a1a, #000);
            padding: 20px;
            border: 4px solid #333;
            border-top: 4px solid var(--neon-green);
            border-bottom: 4px solid var(--neon-purple);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,1), 0 0 30px rgba(57, 255, 20, 0.1);
            z-index: 10;
        }

        .reels {
            display: flex;
            gap: 15px;
            background: #000;
            padding: 10px;
            border-radius: 10px;
        }

        .reel {
            width: 140px;
            height: 200px;
            background: #111;
            overflow: hidden;
            position: relative;
            border: 1px solid #222;
        }

        .strip {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
        }

        .strip img { width: 140px; height: 200px; display: block; object-fit: contain; }

        .controls { margin-top: 40px; text-align: center; z-index: 10; }
        #status { height: 1.5em; font-size: 1.8rem; color: var(--neon-green); margin-bottom: 20px; font-weight: bold; text-shadow: 0 0 10px rgba(0,0,0,0.5); }

        button {
            background: transparent;
            color: var(--neon-green);
            border: 2px solid var(--neon-green);
            padding: 15px 60px;
            font-size: 1.8rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            border-radius: 10px;
            box-shadow: 0 0 10px var(--neon-green);
        }

        button:hover:not(:disabled) {
            background: var(--neon-green);
            color: black;
            box-shadow: 0 0 30px var(--neon-green);
        }

        button:disabled { opacity: 0.2; cursor: wait; box-shadow: none; }
    </style>
</head>
<body>

    <div class="kanji" style="top:10%; left:5%;">ゴ</div>
    <div class="kanji" style="bottom:10%; right:5%;">ゴ</div>
    <div class="kanji" style="top:40%; right:8%;">ゴ</div>

    <h1>CASINO STARDUST</h1>

    <div class="pity-container">
        <span class="pity-label">STAND LUCK METER</span>
        <div class="pity-bar"><div id="pity-fill"></div></div>
    </div>

    <div class="machine">
        <div class="reels">
            <div class="reel"><div id="strip1" class="strip"></div></div>
            <div class="reel"><div id="strip2" class="strip"></div></div>
            <div class="reel"><div id="strip3" class="strip"></div></div>
        </div>
    </div>

    <div class="controls">
        <div id="status">GOOD LUCK</div>
        <button id="spin-btn">SPIN</button>
    </div>

<script>
    const symbols = [
        { id: "Jack", url: "jack.png", weight: 6 },
        { id: "Queen", url: "queen.png", weight: 5 },
        { id: "King", url: "king.png", weight: 4 },
        { id: "Ace", url: "ace.png", weight: 3 },
        { id: "Death", url: "death.png", weight: 2 }
    ];

    // Added all requested payout texts
    const winMessages = {
        "Jack3": "UNCOMMON JACKPOT",
        "Jack2": "Jack of All trades",
        "Queen3": "RARE JACKPOT",
        "Queen2": "Queens pawn",
        "King3": "VERY RARE JACKPOT",
        "King2": "Kings crown",
        "Ace3": "LEGENDARY JACKPOT",
        "Ace2": "Ace in the sleeve",
        "Death3": "NO STAND FOR YOU",
        "Death2": "I LOST THE HOUSE",
        "Death1": "BACKLASH"
    };

    let currentMisses = 0;
    const pityLimit = 10;
    const strips = [document.getElementById('strip1'), document.getElementById('strip2'), document.getElementById('strip3')];

    function buildStrips() {
        strips.forEach(strip => {
            strip.innerHTML = '';
            const fullList = [];
            for(let i=0; i<60; i++) { fullList.push(...symbols); }
            fullList.forEach(s => {
                const img = document.createElement('img');
                img.src = s.url;
                strip.appendChild(img);
            });
        });
    }

    function weightedRandom() {
        let total = symbols.reduce((s, item) => s + item.weight, 0);
        let r = Math.random() * total;
        for (let s of symbols) {
            if (r < s.weight) return s;
            r -= s.weight;
        }
    }

    document.getElementById('spin-btn').addEventListener('click', function() {
        const btn = this;
        btn.disabled = true;
        document.getElementById('status').innerText = "ROLLING...";
        
        // Reset positions to ensure they move from the top every time
        strips.forEach(s => { s.style.transition = 'none'; s.style.top = '0px'; });

        setTimeout(() => {
            let results;
            if (currentMisses >= pityLimit) {
                // Guaranteed 3x Jackpot (excluding Death for the Pity win)
                const win = symbols[Math.floor(Math.random() * 4)]; 
                results = [win, win, win];
            } else {
                results = [weightedRandom(), weightedRandom(), weightedRandom()];
            }

            strips.forEach((strip, i) => {
                const symbolIndex = symbols.findIndex(s => s.id === results[i].id);
                // Large move amount to make the spin look fast
                const moveAmount = ((50 * symbols.length) + symbolIndex) * 200;
                strip.style.transition = `top ${2 + (i * 0.5)}s cubic-bezier(0.1, 0, 0.1, 1)`;
                strip.style.top = `-${moveAmount}px`;
            });

            setTimeout(() => {
                const counts = {};
                results.forEach(r => counts[r.id] = (counts[r.id] || 0) + 1);
                
                let foundWin = false;
                let message = "Nothing Special...";

                // Priority logic: 3 of a kind > 2 of a kind > 1 Death
                for (const s of symbols) {
                    if (counts[s.id] === 3) {
                        message = winMessages[s.id + "3"];
                        currentMisses = 0; // Reset Pity on Jackpot
                        foundWin = true;
                        break;
                    }
                }

                if (!foundWin) {
                    for (const s of symbols) {
                        if (counts[s.id] === 2) {
                            message = winMessages[s.id + "2"];
                            foundWin = true;
                            break;
                        }
                    }
                }

                if (!foundWin && counts["Death"] === 1) {
                    message = winMessages["Death1"];
                    foundWin = true;
                }

                if (!foundWin) {
                    currentMisses++;
                }

                document.getElementById('status').innerText = message;
                document.getElementById('pity-fill').style.width = (currentMisses / pityLimit * 100) + "%";
                btn.disabled = false;
            }, 3500);
        }, 50);
    });

    buildStrips();
</script>
</body>
</html>
