<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STARDUST CARDS: NEON EDITION</title>
    <style>
        :root {
            --neon-green: #39ff14;
            --neon-cyan: #00f3ff;
            --dark-carbon: #121212;
            --gold: #ffd700;
        }

        body {
            background-color: #080808;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            overflow-x: hidden;
        }

        h1 {
            color: var(--neon-green);
            text-shadow: 0 0 10px var(--neon-green), 2px 2px #000;
            font-size: 3rem;
            margin: 20px 0 5px 0;
            letter-spacing: 5px;
        }

        .menacing {
            color: #ff00ff;
            font-weight: bold;
            font-style: italic;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; text-shadow: 0 0 15px #ff00ff; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        /* Pity Bar Styles */
        .pity-container {
            width: 300px;
            background: #222;
            border: 2px solid var(--neon-cyan);
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
        }

        #pity-bar {
            height: 20px;
            width: 0%;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-green));
            transition: width 0.3s ease;
        }

        .pity-label {
            font-size: 0.8rem;
            color: var(--neon-cyan);
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .machine-frame {
            background: var(--dark-carbon);
            padding: 25px;
            border: 4px solid var(--neon-green);
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.2), inset 0 0 15px #000;
            position: relative;
        }

        .reels-container {
            display: flex;
            gap: 15px;
            background: #000;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #333;
        }

        .reel {
            width: 140px;
            height: 200px;
            background: #111;
            overflow: hidden;
            position: relative;
            border: 1px solid #222;
        }

        .reel-strip { position: absolute; top: 0; left: 0; width: 100%; }
        .reel-strip img { width: 140px; height: 200px; display: block; object-fit: contain; }

        .controls { margin-top: 30px; text-align: center; }
        
        #status { 
            height: 1.5em; 
            color: var(--neon-green); 
            font-size: 2rem; 
            text-shadow: 0 0 10px var(--neon-green);
            margin-bottom: 20px;
        }

        #spin-btn {
            background: transparent;
            color: var(--neon-green);
            padding: 15px 60px;
            font-size: 2rem;
            font-weight: bold;
            border: 3px solid var(--neon-green);
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
        }

        #spin-btn:hover {
            background: var(--neon-green);
            color: black;
            box-shadow: 0 0 20px var(--neon-green);
        }

        #spin-btn:disabled { opacity: 0.3; filter: grayscale(1); }

    </style>
</head>
<body>

    <p class="menacing">MENACING...</p>
    <h1>STARDUST CARDS</h1>

    <div class="pity-label">Luck Meter (Guaranteed Jackpot)</div>
    <div class="pity-container">
        <div id="pity-bar"></div>
    </div>
    
    <div class="machine-frame">
        <div class="reels-container">
            <div class="reel"><div id="strip1" class="reel-strip"></div></div>
            <div class="reel"><div id="strip2" class="reel-strip"></div></div>
            <div class="reel"><div id="strip3" class="reel-strip"></div></div>
        </div>
    </div>

    <div class="controls">
        <h2 id="status">PRESS START</h2>
        <button id="spin-btn">SPIN</button>
    </div>

<script>
    // --- SETTINGS YOU CAN EDIT ---
    const pityLimit = 10; // Number of misses until a forced Jackpot
    let currentMisses = 0;

    const symbols = [
        { id: "Jack", url: "jack.png", weight: 6 },
        { id: "Queen", url: "queen.png", weight: 5 },
        { id: "King", url: "king.png", weight: 4 },
        { id: "Ace", url: "ace.png", weight: 3 },
        { id: "Death", url: "death.png", weight: 2 }
    ];

    const payouts = [
        { symId: "Death", count: 1, message: "BACKLASH" },
        { symId: "Death", count: 2, message: "I LOST THE HOUSE" },
        { symId: "Death", count: 3, message: "NO STAND FOR YOU" },
        { symId: "Ace", count: 3, message: "LEGENDARY JACKPOT" },
        { symId: "Ace", count: 2, message: "Ace in the sleeve" },
        { symId: "King", count: 3, message: "VERY RARE JACKPOT" },
        { symId: "King", count: 2, message: "Kings crown" },
        { symId: "Queen", count: 3, message: "RARE JACKPOT" },
        { symId: "Queen", count: 2, message: "Queens pawn" },
        { symId: "Jack", count: 3, message: "UNCOMMON JACKPOT" },
        { symId: "Jack", count: 2, message: "Jack of All trades" }
    ];

    const strips = [document.getElementById('strip1'), document.getElementById('strip2'), document.getElementById('strip3')];

    function initStrips() {
        strips.forEach(strip => {
            strip.innerHTML = '';
            for(let i=0; i<40; i++) {
                symbols.forEach(s => {
                    const img = document.createElement('img');
                    img.src = s.url;
                    strip.appendChild(img);
                });
            }
            strip.style.top = '0px';
        });
    }

    function weightedRandom() {
        let total = symbols.reduce((s, item) => s + item.weight, 0);
        let r = Math.random() * total;
        for (let s of symbols) {
            if (r < s.weight) return s;
            r -= s.weight;
        }
    }

    function updatePityBar() {
        const percent = (currentMisses / pityLimit) * 100;
        document.getElementById('pity-bar').style.width = percent + "%";
    }

    document.getElementById('spin-btn').addEventListener('click', () => {
        const btn = document.getElementById('spin-btn');
        btn.disabled = true;
        document.getElementById('status').innerText = "ROLLING...";
        strips.forEach(s => { s.style.transition = 'none'; s.style.top = '0px'; });

        setTimeout(() => {
            let results;
            
            // CHECK FOR PITY TRIGGER
            if (currentMisses >= pityLimit) {
                // FORCE 3 OF A KIND (Excluding Death)
                const luckyCard = symbols[Math.floor(Math.random() * 4)]; // 0 to 3 (J, Q, K, A)
                results = [luckyCard, luckyCard, luckyCard];
                currentMisses = 0;
            } else {
                results = [weightedRandom(), weightedRandom(), weightedRandom()];
            }

            strips.forEach((strip, i) => {
                const symbolIndex = symbols.findIndex(s => s.id === results[i].id);
                const finalPosition = -((20 * symbols.length * 200) + (symbolIndex * 200));
                strip.style.transition = `top ${2 + (i * 0.5)}s cubic-bezier(0.1, 0, 0.1, 1)`;
                strip.style.top = `${finalPosition}px`;
            });

            setTimeout(() => { 
                checkWinner(results); 
                btn.disabled = false;
                updatePityBar();
            }, 3500);
        }, 50);
    });

    function checkWinner(results) {
        const counts = {};
        results.forEach(r => { counts[r.id] = (counts[r.id] || 0) + 1; });
        const winRule = payouts.find(p => counts[p.symId] >= p.count);
        
        if (winRule) {
            document.getElementById('status').innerText = winRule.message;
            // Reset misses if they got a 3-of-a-kind jackpot naturally
            if (winRule.count === 3) currentMisses = 0; 
        } else {
            document.getElementById('status').innerText = "Nothing Special...";
            currentMisses++;
        }
    }

    initStrips();
</script>
</body>
</html>
