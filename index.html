<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stardust Cards: Official Deck</title>
    <style>
        :root {
            --jojo-purple: #4b0082;
            --jojo-pink: #ff00ff;
            --jojo-gold: #ffd700;
        }

        body {
            background-color: #0d0d0d;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            color: var(--jojo-gold);
            text-shadow: 3px 3px var(--jojo-purple);
            font-size: 3rem;
            margin: 20px 0;
        }

        .machine-frame {
            background: #1a1a1a;
            padding: 20px;
            border: 8px double var(--jojo-gold);
            border-radius: 15px;
            box-shadow: 0 0 30px var(--jojo-purple);
        }

        .reels-container {
            display: flex;
            gap: 10px;
            background: #000;
            padding: 10px;
            border-radius: 5px;
            overflow: hidden;
        }

        .reel {
            width: 140px;
            height: 200px; /* Adjusted for card shape */
            background: #222;
            overflow: hidden;
            position: relative;
            border: 2px solid #444;
        }

        .reel-strip {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
        }

        .reel-strip img {
            width: 140px;
            height: 200px;
            display: block;
            object-fit: contain;
            background: #000;
        }

        .controls { margin-top: 25px; text-align: center; }
        #status { height: 1.5em; color: var(--jojo-pink); font-size: 1.8rem; text-shadow: 2px 2px #000; }

        #spin-btn {
            background: linear-gradient(to bottom, var(--jojo-pink), var(--jojo-purple));
            color: white;
            padding: 15px 50px;
            font-size: 1.8rem;
            font-weight: bold;
            border: 3px solid var(--jojo-gold);
            border-radius: 50px;
            cursor: pointer;
        }

        #spin-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

    <h1>STARDUST CARDS</h1>
    
    <div class="machine-frame">
        <div class="reels-container">
            <div class="reel"><div id="strip1" class="reel-strip"></div></div>
            <div class="reel"><div id="strip2" class="reel-strip"></div></div>
            <div class="reel"><div id="strip3" class="reel-strip"></div></div>
        </div>
    </div>

    <div class="controls">
        <h2 id="status">DEAL THE CARDS</h2>
        <button id="spin-btn">SPIN!</button>
    </div>

<script>
    // Direct links to your GitHub files
    const symbols = [
        { id: "Jack", url: "jack.png", weight: 6 },
        { id: "Queen", url: "queen.png", weight: 5 },
        { id: "King", url: "king.png", weight: 4 },
        { id: "Ace", url: "ace.png", weight: 3 },
        { id: "Death", url: "death.png", weight: 2 }
    ];

    const payouts = [
        { symId: "Death", count: 3, message: "NO STAND FOR YOU" },
        { symId: "Death", count: 2, message: "I LOST THE HOUSE" },
        { symId: "Death", count: 1, message: "BACKLASH" },
        { symId: "Ace", count: 3, message: "LEGENDARY JACKPOT" },
        { symId: "Ace", count: 2, message: "Ace in the sleeve" },
        { symId: "King", count: 3, message: "VERY RARE JACKPOT" },
        { symId: "King", count: 2, message: "Kings crown" },
        { symId: "Queen", count: 3, message: "RARE JACKPOT" },
        { symId: "Queen", count: 2, message: "Queens pawn" },
        { symId: "Jack", count: 3, message: "UNCOMMON JACKPOT" },
        { symId: "Jack", count: 2, message: "Jack of All trades" }
    ];

    const strips = [document.getElementById('strip1'), document.getElementById('strip2'), document.getElementById('strip3')];

    function initStrips() {
        strips.forEach(strip => {
            strip.innerHTML = '';
            const list = [];
            // Create a long list for the animation
            for(let i=0; i<40; i++) { list.push(...symbols); }
            list.forEach(s => {
                const img = document.createElement('img');
                img.src = s.url;
                strip.appendChild(img);
            });
            strip.style.top = '0px';
        });
    }

    function weightedRandom() {
        let total = symbols.reduce((s, item) => s + item.weight, 0);
        let r = Math.random() * total;
        for (let s of symbols) {
            if (r < s.weight) return s;
            r -= s.weight;
        }
    }

    document.getElementById('spin-btn').addEventListener('click', () => {
        const btn = document.getElementById('spin-btn');
        btn.disabled = true;
        document.getElementById('status').innerText = "ROLLING...";
        strips.forEach(s => { s.style.transition = 'none'; s.style.top = '0px'; });

        setTimeout(() => {
            const results = [weightedRandom(), weightedRandom(), weightedRandom()];
            strips.forEach((strip, i) => {
                const symbolIndex = symbols.findIndex(s => s.id === results[i].id);
                // 200 is the height of your card images
                const finalPosition = -((20 * symbols.length * 200) + (symbolIndex * 200));
                strip.style.transition = `top ${2 + (i * 0.5)}s cubic-bezier(0.1, 0, 0.1, 1)`;
                strip.style.top = `${finalPosition}px`;
            });
            setTimeout(() => { 
                checkWinner(results); 
                btn.disabled = false; 
            }, 3500);
        }, 50);
    });

    function checkWinner(results) {
        const counts = {};
        results.forEach(r => { counts[r.id] = (counts[r.id] || 0) + 1; });
        const winRule = payouts.find(p => counts[p.symId] >= p.count);
        document.getElementById('status').innerText = winRule ? winRule.message : "Nothing Special...";
    }

    initStrips();
</script>
</body>
</html>
