<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STARDUST CASINO: DUAL DEATH</title>
    <style>
        :root {
            --neon-purple: #9d00ff;
            --neon-gold: #ffd700;
            --neon-red: #ff0000;
            --bg-dark: #0a0510;
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 50%, #1a0a2e 0%, var(--bg-dark) 100%);
            color: white;
            font-family: 'Segoe UI', Impact, sans-serif;
            display: flex; flex-direction: column; align-items: center;
            margin: 0; min-height: 100vh; overflow-x: hidden;
        }

        h1 {
            color: white;
            text-shadow: 0 0 15px var(--neon-purple);
            font-size: 3.5rem; margin: 30px 0 10px;
            letter-spacing: 12px; font-style: italic;
        }

        /* Pity Bar with Glow Effect */
        .pity-container { width: 350px; margin-bottom: 30px; text-align: center; }
        .pity-bar { width: 100%; height: 12px; background: #000; border: 1px solid var(--neon-purple); border-radius: 5px; overflow: hidden; position: relative; }
        #pity-fill { height: 100%; width: 0%; background: var(--neon-purple); box-shadow: 0 0 15px var(--neon-purple); transition: width 0.4s; }
        
        /* Flash when pity is full */
        .pity-full { animation: pity-pulse 0.5s infinite alternate; border-color: white !important; }
        @keyframes pity-pulse { from { box-shadow: 0 0 5px var(--neon-purple); } to { box-shadow: 0 0 20px white; } }

        .machine {
            background: #120a1d; padding: 25px; border: 4px solid var(--neon-purple);
            border-radius: 20px; box-shadow: 0 0 40px rgba(157, 0, 255, 0.3);
            transition: 0.3s; position: relative; z-index: 10;
        }

        /* Win Visual Effects */
        .jackpot-glow { 
            animation: jackpot-flash 0.3s infinite alternate; 
            border-color: var(--neon-gold) !important;
            box-shadow: 0 0 60px var(--neon-gold) !important;
        }
        @keyframes jackpot-flash { to { filter: brightness(1.8); transform: scale(1.02); } }

        .death-void {
            animation: void-flash 0.1s infinite;
            border-color: var(--neon-red) !important;
            box-shadow: 0 0 80px var(--neon-red) !important;
        }
        @keyframes void-flash { 0% { background: #000; } 100% { background: #400; } }

        .reels { display: flex; gap: 15px; background: #000; padding: 12px; border-radius: 10px; }
        .reel { width: 140px; height: 200px; background: #050505; overflow: hidden; position: relative; border: 1px solid #222; }
        .strip { position: absolute; top: 0; left: 0; width: 100%; }
        .strip img { width: 140px; height: 200px; display: block; object-fit: contain; }

        .controls { margin-top: 40px; text-align: center; }
        #status { height: 1.5em; font-size: 1.8rem; color: white; margin-bottom: 20px; font-weight: bold; }

        button {
            background: transparent; color: white; border: 2px solid var(--neon-purple);
            padding: 15px 80px; font-size: 1.8rem; font-weight: bold;
            cursor: pointer; border-radius: 50px; text-transform: uppercase; transition: 0.3s;
        }
        button:hover:not(:disabled) { background: var(--neon-purple); box-shadow: 0 0 30px var(--neon-purple); }
        button:disabled { opacity: 0.2; }

        .shake-heavy { animation: shake-vibe 0.05s infinite; }
        @keyframes shake-vibe {
            0% { transform: translate(3px, 3px); }
            100% { transform: translate(-3px, -3px); }
        }
    </style>
</head>
<body>

    <h1>STARDUST</h1>

    <div class="pity-container">
        <div class="pity-bar" id="pity-frame"><div id="pity-fill"></div></div>
    </div>

    <div class="machine" id="machine-body">
        <div class="reels">
            <div class="reel"><div id="strip1" class="strip"></div></div>
            <div class="reel"><div id="strip2" class="strip"></div></div>
            <div class="reel"><div id="strip3" class="strip"></div></div>
        </div>
    </div>

    <div class="controls">
        <div id="status">DEAL THE CARDS</div>
        <button id="spin-btn">SPIN</button>
    </div>

<script>
    // --- AUDIO SYSTEM ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playInternalClick() {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.05);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.05);
    }

    const sndPair = new Audio('pair.mp3');
    const sndJack = new Audio('jack_win.mp3');
    const sndQueen = new Audio('queen_win.mp3');
    const sndKing = new Audio('king_win.mp3');
    const sndLegendary = new Audio('legendary.mp3');
    const sndDeathWarn = new Audio('death_warning.mp3'); // For 1x and 2x
    const sndDeathFinal = new Audio('death_final.mp3');     // For 3x Jackpot

    function play(sound) {
        sound.currentTime = 0;
        sound.play().catch(() => {});
    }

    // --- GAME LOGIC ---
    const symbols = [
        { id: "Jack", url: "jack.png", weight: 6 },
        { id: "Queen", url: "queen.png", weight: 5 },
        { id: "King", url: "king.png", weight: 4 },
        { id: "Ace", url: "ace.png", weight: 3 },
        { id: "Death", url: "death.png", weight: 2 }
    ];

    let currentMisses = 0;
    const pityLimit = 10;
    const strips = [document.getElementById('strip1'), document.getElementById('strip2'), document.getElementById('strip3')];

    function init() {
        strips.forEach(strip => {
            strip.innerHTML = '';
            for(let i=0; i<60; i++) {
                symbols.forEach(s => {
                    const img = document.createElement('img');
                    img.src = s.url; strip.appendChild(img);
                });
            }
        });
    }

    document.getElementById('spin-btn').addEventListener('click', function() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        this.disabled = true;
        const status = document.getElementById('status');
        const machine = document.getElementById('machine-body');
        
        status.innerText = "ROLLING...";
        status.style.color = "white";
        machine.classList.remove('jackpot-glow', 'death-void', 'shake-heavy');
        
        strips.forEach(s => { s.style.transition = 'none'; s.style.top = '0px'; });

        setTimeout(() => {
            let results;
            if (currentMisses >= pityLimit) {
                // Guaranteed Jackpot (Any of the 5 symbols)
                const win = symbols[Math.floor(Math.random() * 5)];
                results = [win, win, win];
            } else {
                results = [weightedRandom(), weightedRandom(), weightedRandom()];
            }

            strips.forEach((strip, i) => {
                const symbolIndex = symbols.findIndex(s => s.id === results[i].id);
                const duration = 2 + (i * 0.5);
                strip.style.transition = `top ${duration}s cubic-bezier(0.1, 0, 0.1, 1)`;
                strip.style.top = `-${((50 * symbols.length) + symbolIndex) * 200}px`;
                setTimeout(() => playInternalClick(), duration * 1000);
            });

            setTimeout(() => {
                const counts = {};
                results.forEach(r => counts[r.id] = (counts[r.id] || 0) + 1);
                
                const jackpot = symbols.find(s => counts[s.id] === 3);
                
                if (jackpot) {
                    currentMisses = 0;
                    if (jackpot.id === "Death") {
                        status.innerText = "NO STAND FOR YOU";
                        status.style.color = var(--neon-red);
                        machine.classList.add('death-void', 'shake-heavy');
                        play(sndDeathFinal);
                    } else {
                        machine.classList.add('jackpot-glow');
                        status.style.color = "var(--neon-gold)";
                        if (jackpot.id === "Ace") { status.innerText = "LEGENDARY JACKPOT"; play(sndLegendary); }
                        else if (jackpot.id === "King") { status.innerText = "KING JACKPOT"; play(sndKing); }
                        else if (jackpot.id === "Queen") { status.innerText = "QUEEN JACKPOT"; play(sndQueen); }
                        else { status.innerText = "JACK JACKPOT"; play(sndJack); }
                    }
                } 
                else if (counts["Death"] >= 1) {
                    status.innerText = counts["Death"] === 2 ? "I LOST THE HOUSE" : "BACKLASH";
                    status.style.color = "#ff4444";
                    play(sndDeathWarn);
                    currentMisses++;
                } 
                else {
                    const pair = symbols.find(s => counts[s.id] === 2);
                    if (pair) {
                        status.innerText = pair.id + " Pair";
                        status.style.color = "var(--neon-purple)";
                        play(sndPair);
                    } else {
                        status.innerText = "Nothing Special...";
                    }
                    currentMisses++;
                }

                updatePity();
                this.disabled = false;
            }, 3200);
        }, 50);
    });

    function updatePity() {
        const fill = document.getElementById('pity-fill');
        const frame = document.getElementById('pity-frame');
        const percent = (Math.min(currentMisses/pityLimit, 1)*100);
        fill.style.width = percent + "%";
        
        if (currentMisses >= pityLimit) {
            frame.classList.add('pity-full');
        } else {
            frame.classList.remove('pity-full');
        }
    }

    function weightedRandom() {
        let total = symbols.reduce((s, item) => s + item.weight, 0);
        let r = Math.random() * total;
        for (let s of symbols) {
            if (r < s.weight) return s;
            r -= s.weight;
        }
    }

    init();
</script>
</body>
</html>
