<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EVERY1 SLOTS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;900&display=swap');

:root {
  --gold: #c9a84c;
  --gold-light: #f0d080;
  --gold-dark: #7a5c1e;

  --green: #0f3d2e;
  --green-dark: #071f17;
  --bg: #06140f;

  --text-glow: 0 0 10px #f0d080, 0 0 20px #c9a84c, 0 0 40px #0f3d2e;

  --card-w: 120px;
  --card-h: 190px;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Cinzel',serif;
  overflow:hidden;
  position:relative;
}

body::before {
  content:'';
  position:fixed;
  inset:0;
  background-image:
    repeating-linear-gradient(45deg,transparent,transparent 30px,rgba(15,61,46,.25) 30px,rgba(15,61,46,.25) 60px),
    repeating-linear-gradient(-45deg,transparent,transparent 30px,rgba(201,168,76,.06) 30px,rgba(201,168,76,.06) 60px);
}

.machine {
  padding:28px 36px;
  background:linear-gradient(160deg,var(--green) 0%,var(--bg) 40%,var(--green) 100%);
  border:3px solid var(--gold);
  box-shadow:0 0 30px rgba(201,168,76,.3);
}

.title {
  font-family:'Cinzel Decorative';
  font-size:26px;
  color:var(--gold-light);
  text-shadow:var(--text-glow);
  text-align:center;
}

.reels {
  display:flex;
  gap:10px;
  margin:20px 0;
}

.reel {
  width:120px;
  height:190px;
  overflow:hidden;
  border:1px solid var(--gold-dark);
}

.reel-inner {
  position:absolute;
}

.reel-cell img {
  width:100%;
  height:100%;
}

.spin-btn {
  background:linear-gradient(160deg,var(--gold-light),var(--gold));
  border:none;
  padding:12px 40px;
  cursor:pointer;
}

.result-msg {
  color:var(--gold-light);
  text-align:center;
}
</style>
</head>

<body>

<div class="machine">
  <div class="title">EVERY1 SLOTS</div>

  <div class="reels">
    <div class="reel"><div class="reel-inner" id="reel-inner-0"></div></div>
    <div class="reel"><div class="reel-inner" id="reel-inner-1"></div></div>
    <div class="reel"><div class="reel-inner" id="reel-inner-2"></div></div>
  </div>

  <button class="spin-btn" onclick="spin()">SPIN</button>
  <div class="result-msg" id="result-msg">Ready</div>
</div>

<script>
const IMAGES = {
  J: "jack.png",
  Q: "queen.png",
  K: "king.png",
  A: "ace.png",
  D: "death.png",
};

const WEIGHTS = {
  J: 7,
  Q: 6,
  K: 5,
  A: 4,
  D: 3
};

const SYMBOLS = Object.keys(WEIGHTS);

function randSym() {
  const totalWeight = Object.values(WEIGHTS).reduce((a,b) => a+b, 0);
  let rand = Math.random() * totalWeight;

  for (const sym of SYMBOLS) {
    if (rand < WEIGHTS[sym]) return sym;
    rand -= WEIGHTS[sym];
  }
}

const STRIP_LEN = 20;

function createReel(id) {
  const el = document.getElementById(id);
  el.innerHTML = '';
  for (let i=0;i<STRIP_LEN;i++) {
    const sym = randSym();
    const img = document.createElement('img');
    img.src = IMAGES[sym];
    el.appendChild(img);
  }
}

function spin() {
  createReel("reel-inner-0");
  createReel("reel-inner-1");
  createReel("reel-inner-2");

  document.getElementById('result-msg').textContent = "Spun!";
}

spin();
</script>

</body>
</html>
