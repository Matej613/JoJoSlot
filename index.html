<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON CASINO: STARDUST</title>
    <style>
        :root {
            --neon-green: #39ff14;
            --neon-purple: #bc13fe;
            --neon-pink: #ff00ff;
            --bg-dark: #050505;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(188, 19, 254, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(57, 255, 20, 0.15) 0%, transparent 50%);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .kanji {
            position: fixed;
            color: var(--neon-purple);
            font-size: 5rem;
            opacity: 0.2;
            font-weight: bold;
            font-style: italic;
            z-index: 0;
            pointer-events: none;
        }

        h1 {
            color: var(--neon-green);
            text-shadow: 0 0 10px var(--neon-green), 0 0 20px var(--neon-purple);
            font-size: 3.5rem;
            margin: 30px 0 10px 0;
            letter-spacing: 10px;
            z-index: 10;
        }

        .pity-container {
            width: 350px;
            margin-bottom: 30px;
            z-index: 10;
            text-align: center;
        }

        .pity-label { color: var(--neon-pink); text-transform: uppercase; font-weight: bold; margin-bottom: 5px; display: block; }
        .pity-bar { width: 100%; height: 12px; background: #111; border: 2px solid var(--neon-pink); border-radius: 10px; overflow: hidden; }
        #pity-fill { height: 100%; width: 0%; background: var(--neon-pink); box-shadow: 0 0 10px var(--neon-pink); transition: width 0.4s; }

        .machine {
            background: linear-gradient(145deg, #1a1a1a, #000);
            padding: 20px;
            border: 4px solid #333;
            border-top: 4px solid var(--neon-green);
            border-bottom: 4px solid var(--neon-purple);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,1);
            z-index: 10;
        }

        .reels {
            display: flex;
            gap: 15px;
            background: #000;
            padding: 10px;
            border-radius: 10px;
        }

        .reel {
            width: 140px;
            height: 200px;
            background: #111;
            overflow: hidden;
            position: relative;
            border: 1px solid #222;
        }

        .strip { position: absolute; top: 0; left: 0; width: 100%; }
        .strip img { width: 140px; height: 200px; display: block; object-fit: contain; }

        .controls { margin-top: 40px; text-align: center; z-index: 10; }
        #status { height: 1.5em; font-size: 1.8rem; color: var(--neon-green); margin-bottom: 20px; font-weight: bold; }

        button {
            background: transparent;
            color: var(--neon-green);
            border: 2px solid var(--neon-green);
            padding: 15px 60px;
            font-size: 1.8rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 10px;
            text-transform: uppercase;
        }

        button:hover:not(:disabled) { background: var(--neon-green); color: black; box-shadow: 0 0 30px var(--neon-green); }
        button:disabled { opacity: 0.2; }
    </style>
</head>
<body>

    <div class="kanji" style="top:10%; left:5%;">ゴ</div>
    <div class="kanji" style="bottom:10%; right:5%;">ゴ</div>

    <h1>CASINO STARDUST</h1>

    <div class="pity-container">
        <span class="pity-label">JACKPOT LUCK METER</span>
        <div class="pity-bar"><div id="pity-fill"></div></div>
    </div>

    <div class="machine">
        <div class="reels">
            <div class="reel"><div id="strip1" class="strip"></div></div>
            <div class="reel"><div id="strip2" class="strip"></div></div>
            <div class="reel"><div id="strip3" class="strip"></div></div>
        </div>
    </div>

    <div class="controls">
        <div id="status">DEAL THE CARDS</div>
        <button id="spin-btn">SPIN</button>
    </div>

<script>
    const symbols = [
        { id: "Jack", url: "jack.png", weight: 6 },
        { id: "Queen", url: "queen.png", weight: 5 },
        { id: "King", url: "king.png", weight: 4 },
        { id: "Ace", url: "ace.png", weight: 3 },
        { id: "Death", url: "death.png", weight: 2 }
    ];

    let currentMisses = 0;
    const pityLimit = 10;
    const strips = [document.getElementById('strip1'), document.getElementById('strip2'), document.getElementById('strip3')];

    function buildStrips() {
        strips.forEach(strip => {
            strip.innerHTML = '';
            const fullList = [];
            for(let i=0; i<60; i++) { fullList.push(...symbols); }
            fullList.forEach(s => {
                const img = document.createElement('img');
                img.src = s.url;
                strip.appendChild(img);
            });
        });
    }

    function weightedRandom() {
        let total = symbols.reduce((s, item) => s + item.weight, 0);
        let r = Math.random() * total;
        for (let s of symbols) {
            if (r < s.weight) return s;
            r -= s.weight;
        }
    }

    document.getElementById('spin-btn').addEventListener('click', function() {
        this.disabled = true;
        document.getElementById('status').innerText = "ROLLING...";
        strips.forEach(s => { s.style.transition = 'none'; s.style.top = '0px'; });

        setTimeout(() => {
            let results;
            if (currentMisses >= pityLimit) {
                const win = symbols[Math.floor(Math.random() * 5)]; 
                results = [win, win, win];
            } else {
                results = [weightedRandom(), weightedRandom(), weightedRandom()];
            }

            strips.forEach((strip, i) => {
                const symbolIndex = symbols.findIndex(s => s.id === results[i].id);
                const moveAmount = ((50 * symbols.length) + symbolIndex) * 200;
                strip.style.transition = `top ${2 + (i * 0.5)}s cubic-bezier(0.1, 0, 0.1, 1)`;
                strip.style.top = `-${moveAmount}px`;
            });

            setTimeout(() => {
                const counts = {};
                results.forEach(r => counts[r.id] = (counts[r.id] || 0) + 1);
                
                let message = "Nothing Special...";
                let isJackpot = false;

                // 1. CHECK FOR 3 OF A KIND (JACKPOTS)
                const jackpot = symbols.find(s => counts[s.id] === 3);
                if (jackpot) {
                    isJackpot = true;
                    if (jackpot.id === "Jack") message = "UNCOMMON JACKPOT";
                    if (jackpot.id === "Queen") message = "RARE JACKPOT";
                    if (jackpot.id === "King") message = "VERY RARE JACKPOT";
                    if (jackpot.id === "Ace") message = "LEGENDARY JACKPOT";
                    if (jackpot.id === "Death") message = "NO STAND FOR YOU";
                } 
                // 2. CHECK FOR DEATH PRIORITY (IF NO JACKPOT)
                else if (counts["Death"] === 2) {
                    message = "I LOST THE HOUSE";
                } else if (counts["Death"] === 1) {
                    message = "BACKLASH";
                } 
                // 3. CHECK FOR 2 OF A KIND (ONLY IF NO DEATH IS PRESENT)
                else {
                    if (counts["Jack"] === 2) message = "Jack of All trades";
                    else if (counts["Queen"] === 2) message = "Queens pawn";
                    else if (counts["King"] === 2) message = "Kings crown";
                    else if (counts["Ace"] === 2) message = "Ace in the sleeve";
                }

                if (isJackpot) {
                    currentMisses = 0;
                } else {
                    currentMisses++;
                }

                document.getElementById('status').innerText = message;
                document.getElementById('pity-fill').style.width = (Math.min(currentMisses / pityLimit, 1) * 100) + "%";
                document.getElementById('spin-btn').disabled = false;
            }, 3500);
        }, 50);
    });

    buildStrips();
</script>
</body>
</html>
